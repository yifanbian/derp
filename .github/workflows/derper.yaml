name: derper

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Tailscale version to build (e.g. v1.80.2); empty means latest release"
        required: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$INPUT_VERSION"
          latest=false
          if [ -z "$version" ]; then
            version=$(gh api repos/tailscale/tailscale/releases/latest --jq .tag_name)
            latest=true
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected version: $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=${version#v}" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/derper" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: exists
        run: |
          if docker buildx imagetools inspect "${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.exists.outputs.exists != 'true'

      - name: Compute tags
        id: tags
        if: steps.exists.outputs.exists != 'true'
        run: |
          tags="${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.tag }}"
          if [ "${{ steps.ver.outputs.latest }}" = "true" ]; then
            tags="$tags,${{ steps.ver.outputs.image }}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        if: steps.exists.outputs.exists != 'true'
        with:
          context: derper
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: DERPER_VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/tailscale/tailscale
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
