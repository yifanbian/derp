name: derp-admission

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: derp-admission
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: derp-admission/go.mod
      - run: go vet ./...
      - run: go build ./...
      - run: go test ./...

  image:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: derp-admission-image
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      MAJOR_MINOR: ${{ vars.MAJOR_MINOR || '0.1' }}
      RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        if: env.RELEASE == 'true'
        run: |
          [[ "$MAJOR_MINOR" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "invalid MAJOR_MINOR: $MAJOR_MINOR" >&2; exit 1; }
          git fetch --tags --force -q
          last=$(git tag -l "derp-admission/v${MAJOR_MINOR}.*" | sed 's#.*\.##' | sort -n | tail -1)
          echo "version=${MAJOR_MINOR}.$(( ${last:--1} + 1 ))" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/derp-admission
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ env.RELEASE == 'true' }}
            type=raw,value=${{ env.MAJOR_MINOR }},enable=${{ env.RELEASE == 'true' }}
            type=raw,value=latest,enable=${{ env.RELEASE == 'true' }}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: derp-admission
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tag release
        if: env.RELEASE == 'true'
        run: |
          git tag "derp-admission/v${{ steps.ver.outputs.version }}" "$GITHUB_SHA"
          git push origin "derp-admission/v${{ steps.ver.outputs.version }}"
